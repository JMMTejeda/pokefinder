# A search asked from the phone page (a GitHub issue "Buscar: <text>" opened by the owner with the phone key) is searched here
# with the computer's own engine (.github/buscar.py on .github/motor, both written by `nube.py publish`): eBay's 16 sites through
# the API with this repository's encrypted secrets EBAY_APP_ID / EBAY_CERT_ID, then Mercari, Rakuma, Magi, Card Rush, SNKRDUNK,
# Hareruya2, Rakuten, GempireCards and Vinted in a hidden browser, the buyability and photo checks and Cardmarket (owner,
# 31 October 2026: "search like the computer, in every market"). Progress goes to a comment of the issue (the phone reads it),
# results to api/results/<search id>.json. The issue stays open: the computer's app completes it (grades on the labels).
# Different cards are searched at once; the same card asked again stops the search still going ("Refrescar", a double tap).
# The group carries the author, so nobody else's issue can stop the owner's search. "Run workflow" with a card searches it
# without an issue (tests).
name: Buscar desde el móvil
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      query:
        description: Carta que buscar
        required: true
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: "buscar-${{ github.event.issue.user.login || github.actor }}-${{ github.event.issue.title || format('Buscar: {0}', inputs.query) }}"
  cancel-in-progress: true
jobs:
  buscar:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Buscar:'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NUMBER: ${{ github.event.issue.number }}
      TITLE: "${{ github.event.issue.title || format('Buscar: {0}', inputs.query) }}"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Avisar al móvil
        if: env.NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |-
            **3 %** · GitHub la recibe. Preparando el buscador…

            <!-- pokefinder {"progress": 3, "status": "running", "message": "GitHub la recibe. Preparando el buscador…"} -->
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$BODY" --silent
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Preparar el buscador   # fixed versions (the ones tested on 31 October 2026), not whatever is newest that day
        run: |
          pip install -q playwright==1.64.1 opencv-python-headless==5.0.0.93 numpy==2.5.4 pillow==13.0.0 tzdata==2026.6
          python -m playwright install --with-deps chromium
      # what earlier searches learnt about listings (eBay checks of the last day, cannot be bought), as the computer keeps it
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pokefinder-cache
          key: pokefinder-${{ github.run_id }}
          restore-keys: pokefinder-
      - name: Buscar en todos los mercados
        env:
          GH_TOKEN: ${{ github.token }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          PF_CACHE: ${{ runner.temp }}/pokefinder-cache
        run: |
          git config user.name "PokéFinder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python .github/buscar.py
      - name: Avisar del fallo
        if: failure() && env.NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$NUMBER" --add-label movil-error -R "$GITHUB_REPOSITORY"
