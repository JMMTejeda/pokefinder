<style>
/* Layout: sticky header, then one view at a time (home, folders, one search); results are a photo grid. Single dark world: black and blues. */
:root {
  --bg: #04070f; --panel: #0b1832; --panel2: #10234a; --line: #1a3266; --line2: #26468e;
  --text: #e8f3ff; --muted: #8ea8cf; --blue: #2f81f7; --blue2: #1a5fd6; --sky: #7cc8ff; --cyan: #3fd3ff;
  --ok: #3ee6b0; --warn: #ffc857; --bad: #ff6b81; --gold: #ffd166; --psa: #c8102e; --grade: #6a4cff;
  --display: "Sora", "Segoe UI", system-ui, sans-serif; --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: radial-gradient(900px 500px at 85% -10%, #0d2a63 0%, transparent 60%), var(--bg); color: var(--text); font: 15px/1.45 var(--body); min-height: 100vh; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #050b1a; }
a { color: var(--sky); text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1380px; margin: 0 auto; }
.muted { color: var(--muted); } .small { font-size: 13px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(5, 11, 26, .92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--text); font: 800 19px var(--display); letter-spacing: -.3px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { color: var(--sky); }
.qform { flex: 1; min-width: 200px; display: flex; background: var(--panel); border: 1px solid var(--line2); border-radius: 999px; overflow: hidden; }
.qform input { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 14px; outline: none; }
.qform button { border: 0; padding: 0 16px; font-weight: 700; color: #fff; background: linear-gradient(90deg, var(--blue2), var(--blue)); cursor: pointer; }
.qform:focus-within { border-color: var(--sky); }
.nav { display: flex; gap: 4px; }
.nav button { border: 0; background: none; color: var(--muted); padding: 7px 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }
.nav button.on { color: var(--text); background: var(--panel2); }
.pill { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.pill.on i { background: var(--ok); }

/* search in progress banner */
.running { border-bottom: 1px solid rgba(63, 211, 255, .35); background: linear-gradient(90deg, #0d2c66, #0a1c40); }
.running .wrap { display: flex; align-items: center; gap: 12px; padding-block: 9px; }
.running .spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(124, 200, 255, .25); border-top-color: var(--cyan); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.running .txt { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.running .bar { width: 120px; height: 7px; border-radius: 9px; background: #050c1d; overflow: hidden; flex: none; }
.running .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
.running button { border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 800; color: #04102a; background: var(--cyan); cursor: pointer; flex: none; }

main { padding-block: 18px 60px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.4px; margin: 0; text-wrap: balance; }
.hero { padding-block: 22px 8px; }
.hero h1 { font-size: clamp(26px, 5vw, 40px); line-height: 1.1; }
.hero h1 span { color: var(--sky); }
.hero p { margin: 8px 0 0; color: var(--muted); max-width: 62ch; }
.block { margin-top: 26px; display: grid; gap: 12px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.linkbtn { border: 0; background: none; color: var(--sky); font-weight: 700; cursor: pointer; padding: 0; }

/* photos from the sheets */
.ph { position: relative; aspect-ratio: 3 / 4; max-width: 100%; background-color: #081229; background-repeat: no-repeat; border-radius: inherit; }
.ph.none { display: grid; place-items: center; color: var(--line2); font: 800 26px var(--display); }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; border-radius: 12px; overflow: hidden; background: #050c1d; }
.mosaic .ph { border-radius: 0; }

.colls { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; }
.coll { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 12px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(135deg, #0f2147, #081229); }
.coll h3 { font-size: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips button { border: 1px solid rgba(124, 200, 255, .25); background: rgba(47, 129, 247, .14); color: var(--text); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
.stat { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 4px; }
.stat b { color: var(--text); }

.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.folder { text-align: left; border: 1px solid var(--line); background: linear-gradient(180deg, #10265a, #0b1832); border-radius: 16px; padding: 9px; color: var(--text); cursor: pointer; display: grid; gap: 6px; }
.folder:hover, .folder:focus-visible { border-color: var(--sky); outline: none; }
.folder .ft { font-weight: 800; line-height: 1.25; }
.folder .fl { font-size: 12.5px; color: var(--muted); }
.tag { font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(47, 129, 247, .16); color: var(--sky); border: 1px solid var(--line2); justify-self: start; }
.tag.wait { color: var(--warn); border-color: rgba(255, 200, 87, .4); background: rgba(255, 200, 87, .08); }

/* one search */
.shead { display: grid; gap: 6px; }
.shead .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line2); background: var(--panel2); color: var(--text); padding: 8px 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }
.btn:hover { border-color: var(--sky); }
.job { margin-top: 12px; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(63, 211, 255, .35); background: linear-gradient(135deg, #10285c, #081229); display: grid; gap: 8px; }
.job .top2 { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; }
.job .pct { color: var(--cyan); font-variant-numeric: tabular-nums; }
.track { height: 11px; border-radius: 99px; background: #050c1d; overflow: hidden; border: 1px solid var(--line); }
.track i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue2), var(--cyan)); transition: width .5s; }
.steps { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); list-style: none; margin: 0; padding: 0; }
.steps .done { color: var(--ok); } .steps .now { color: var(--cyan); font-weight: 800; }
.pokes { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; }
.pk { flex: none; display: grid; justify-items: center; gap: 4px; width: 76px; padding: 7px 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--text); }
.pk .av { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 2px solid var(--line2); }
.pk .av .ph { aspect-ratio: auto; height: 100%; }
.pk span { font-size: 11.5px; font-weight: 700; text-align: center; line-height: 1.15; }
.pk small { font-size: 10.5px; color: var(--muted); }
.pk.on { border-color: var(--cyan); background: #123270; }
.tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.tools .count { font-weight: 800; }
.tools .r { display: flex; gap: 8px; flex-wrap: wrap; }
select { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 7px 10px; }
.filters { display: grid; gap: 12px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 12px; }
.fg { display: grid; gap: 6px; }
.fg h4 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button { border: 1px solid var(--line2); background: #071229; color: var(--muted); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.pills button.on { color: #fff; border-color: transparent; background: linear-gradient(90deg, var(--blue2), var(--blue)); }
.price { display: flex; gap: 6px; align-items: center; }
.price input { width: 110px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line2); background: #050c1d; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(180deg, #0d1d3e, #091530); min-width: 0; }
.card .phw { position: relative; display: block; }
.card .ph { border-radius: 0; }
.ov { position: absolute; left: 7px; right: 7px; display: flex; gap: 5px; flex-wrap: wrap; }
.ov.t { top: 7px; } .ov.b { bottom: 7px; }
.b { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: rgba(4, 9, 22, .85); color: var(--text); border: 1px solid rgba(124, 200, 255, .3); }
.b.new { background: var(--gold); color: #2a1d00; border-color: transparent; }
.card.sold { border: 2px solid #22c55e; box-shadow: 0 0 0 1px rgba(34, 197, 94, .35); }
.b.sold { background: #16a34a; color: #fff; border-color: transparent; }
.card .sold-info { color: #4ade80; font-weight: 700; }
.b.psa { background: var(--psa); color: #fff; border-color: transparent; }
.b.gr { background: var(--grade); color: #fff; border-color: transparent; }
.b.auc { background: var(--warn); color: #2a1d00; border-color: transparent; }
.b.ed { background: #0b2b4d; color: var(--gold); border-color: rgba(255, 209, 102, .5); }
.ptag { font: 800 18px var(--display); padding: 3px 10px; border-radius: 10px; color: #fff; background: rgba(26, 95, 214, .95); }
.card .bd { display: grid; gap: 5px; padding: 9px 11px 11px; flex: 1; align-content: start; }
.card .tt { font-weight: 700; font-size: 13.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text); }
.card .wh { font-size: 12px; color: var(--muted); }
.card .wh b { color: var(--sky); }
.go { margin-top: auto; display: block; text-align: center; padding: 10px; border-radius: 12px; font-weight: 800; color: #fff; background: linear-gradient(90deg, var(--blue2), var(--blue), var(--cyan)); }
.empty { padding: 30px 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 12px; background: #102a5c; border: 1px solid var(--sky); font-weight: 700; }
/* connect this phone (the phone key, once) */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(2, 6, 16, .78); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.sheet { width: min(100%, 520px); display: grid; gap: 12px; padding: 18px; border-radius: 18px; border: 1px solid var(--line2); background: linear-gradient(180deg, #10265a, #0b1832); }
.sheet h2 { font-size: 21px; }
.sheet p, .sheet ol { margin: 0; color: var(--muted); }
.sheet ol { padding-left: 20px; display: grid; gap: 6px; }
.sheet b { color: var(--text); }
.sheet input { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line2); background: #050c1d; font-size: 16px; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .go { margin-top: 0; border: 0; cursor: pointer; font: inherit; font-weight: 800; flex: 1; }
.sheet .msg { min-height: 1.2em; font-weight: 700; color: var(--warn); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
@media (max-width: 720px) {
  .brand span { display: none; }
  .qform { order: 3; flex-basis: 100%; }
  .pill { margin-left: auto; }
  .coll { grid-template-columns: 110px 1fr; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .folders { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .running .bar { display: none; }
  .ptag { font-size: 15px; }
}
/* the page only scrolls up and down on the phone (owner, 1 November 2026: "the page must not move left and right while I scroll");
   the strips that scroll sideways on purpose (Pokémon buttons, chips) still do */
html, body { overflow-x: hidden; overscroll-behavior-x: none; max-width: 100%; }
body { position: relative; touch-action: pan-y pinch-zoom; }
.pokes, .chips, .pills, .runlist .wrap { touch-action: pan-x pan-y; overscroll-behavior-x: contain; }
/* light or full search (owner, 1 November 2026) */
.depthbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-block: 8px; font-size: 13px; color: var(--muted); }
.depthbar button { border: 1px solid var(--line2); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-weight: 700; cursor: pointer; }
.depthbar button.on { color: #fff; border-color: transparent; background: linear-gradient(90deg, var(--blue2), var(--blue)); }
.depthbar small { flex-basis: 100%; }
/* every search in progress or waiting (opened from the banner) */
.runlist { border-bottom: 1px solid rgba(63, 211, 255, .35); background: #081633; }
.runlist .wrap { display: grid; gap: 8px; padding-block: 10px; max-height: 60vh; overflow: auto; }
.rl-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
.rl-row.busy { border-color: rgba(63, 211, 255, .55); }
.rl-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
.rl-main b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rl-st { font-size: 12.5px; color: var(--cyan); font-weight: 700; }
.rl-row:not(.busy) .rl-st { color: var(--warn); }
.rl-bar { height: 6px; border-radius: 9px; background: #050c1d; overflow: hidden; }
.rl-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
@media (prefers-reduced-motion: reduce) { .running .spin { animation: none; } .track i { transition: none; } }
</style>

<script>/* PokéFinder's search engine inside the phone page (owner, 28 October 2026: "with only PokéFinder open on the phone, in Safari, the

async function ask(body) {

    const title = (body.group ? "Grupo: " + body.group : "Buscar: " + body.query) + (S.depth === "full" ? " [completa]" : "");
    // the same search asked again replaces the one still waiting (the Worker did the same)

async function followPhone() {   // each search GitHub is doing for this phone: its bar, its results as they come, done or failed

async function merge(id, url) {   // a search's newest results replace what the page carries (the published copy, or a phone search's own commit)

    if (d.at < (S.got[id] || 0)) return true;   // the page already has newer ones
    S.got[id] = d.at;
    const s = { ...d.search, thumbs: d.listings.filter((l) => l.x).slice(0, 4).map((l) => l.x) };
