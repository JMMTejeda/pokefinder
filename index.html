<style>
/* Layout: sticky header, then one view at a time (home, folders, one search); results are a photo grid. Single dark world: black and blues. */
:root {
  --bg: #04070f; --panel: #0b1832; --panel2: #10234a; --line: #1a3266; --line2: #26468e;
  --text: #e8f3ff; --muted: #8ea8cf; --blue: #2f81f7; --blue2: #1a5fd6; --sky: #7cc8ff; --cyan: #3fd3ff;
  --ok: #3ee6b0; --warn: #ffc857; --bad: #ff6b81; --gold: #ffd166; --psa: #c8102e; --grade: #6a4cff;
  --display: "Sora", "Segoe UI", system-ui, sans-serif; --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: radial-gradient(900px 500px at 85% -10%, #0d2a63 0%, transparent 60%), var(--bg); color: var(--text); font: 15px/1.45 var(--body); min-height: 100vh; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #050b1a; }
a { color: var(--sky); text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1380px; margin: 0 auto; }
.muted { color: var(--muted); } .small { font-size: 13px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(5, 11, 26, .92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--text); font: 800 19px var(--display); letter-spacing: -.3px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { color: var(--sky); }
.qform { flex: 1; min-width: 200px; display: flex; background: var(--panel); border: 1px solid var(--line2); border-radius: 999px; overflow: hidden; }
.qform input { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 14px; outline: none; }
.qform button { border: 0; padding: 0 16px; font-weight: 700; color: #fff; background: linear-gradient(90deg, var(--blue2), var(--blue)); cursor: pointer; }
.qform:focus-within { border-color: var(--sky); }
.nav { display: flex; gap: 4px; }
.nav button { border: 0; background: none; color: var(--muted); padding: 7px 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }
.nav button.on { color: var(--text); background: var(--panel2); }
.pill { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.pill.on i { background: var(--ok); }

/* search in progress banner */
.running { border-bottom: 1px solid rgba(63, 211, 255, .35); background: linear-gradient(90deg, #0d2c66, #0a1c40); }
.running .wrap { display: flex; align-items: center; gap: 12px; padding-block: 9px; }
.running .spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(124, 200, 255, .25); border-top-color: var(--cyan); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.running .txt { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.running .bar { width: 120px; height: 7px; border-radius: 9px; background: #050c1d; overflow: hidden; flex: none; }
.running .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
.running button { border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 800; color: #04102a; background: var(--cyan); cursor: pointer; flex: none; }

main { padding-block: 18px 60px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.4px; margin: 0; text-wrap: balance; }
.hero { padding-block: 22px 8px; }
.hero h1 { font-size: clamp(26px, 5vw, 40px); line-height: 1.1; }
.hero h1 span { color: var(--sky); }
.hero p { margin: 8px 0 0; color: var(--muted); max-width: 62ch; }
.block { margin-top: 26px; display: grid; gap: 12px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.linkbtn { border: 0; background: none; color: var(--sky); font-weight: 700; cursor: pointer; padding: 0; }

/* photos from the sheets */
.ph { position: relative; aspect-ratio: 3 / 4; max-width: 100%; background-color: #081229; background-repeat: no-repeat; border-radius: inherit; }
.ph.none { display: grid; place-items: center; color: var(--line2); font: 800 26px var(--display); }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; border-radius: 12px; overflow: hidden; background: #050c1d; }
.mosaic .ph { border-radius: 0; }

.colls { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; }
.coll { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 12px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(135deg, #0f2147, #081229); }
.coll h3 { font-size: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips button { border: 1px solid rgba(124, 200, 255, .25); background: rgba(47, 129, 247, .14); color: var(--text); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
.stat { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 4px; }
.stat b { color: var(--text); }

.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.folder { text-align: left; border: 1px solid var(--line); background: linear-gradient(180deg, #10265a, #0b1832); border-radius: 16px; padding: 9px; color: var(--text); cursor: pointer; display: grid; gap: 6px; }
.folder:hover, .folder:focus-visible { border-color: var(--sky); outline: none; }
.folder .ft { font-weight: 800; line-height: 1.25; }
.folder .fl { font-size: 12.5px; color: var(--muted); }
.tag { font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(47, 129, 247, .16); color: var(--sky); border: 1px solid var(--line2); justify-self: start; }
.tag.wait { color: var(--warn); border-color: rgba(255, 200, 87, .4); background: rgba(255, 200, 87, .08); }

/* one search */
.shead { display: grid; gap: 6px; }
.shead .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line2); background: var(--panel2); color: var(--text); padding: 8px 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }
.btn:hover { border-color: var(--sky); }
.job { margin-top: 12px; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(63, 211, 255, .35); background: linear-gradient(135deg, #10285c, #081229); display: grid; gap: 8px; }
.job .top2 { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; }
.job .pct { color: var(--cyan); font-variant-numeric: tabular-nums; }
.track { height: 11px; border-radius: 99px; background: #050c1d; overflow: hidden; border: 1px solid var(--line); }
.track i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue2), var(--cyan)); transition: width .5s; }
.steps { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); list-style: none; margin: 0; padding: 0; }
.steps .done { color: var(--ok); } .steps .now { color: var(--cyan); font-weight: 800; }
.pokes { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; }
.pk { flex: none; display: grid; justify-items: center; gap: 4px; width: 76px; padding: 7px 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--text); }
.pk .av { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 2px solid var(--line2); }
.pk .av .ph { aspect-ratio: auto; height: 100%; }
.pk span { font-size: 11.5px; font-weight: 700; text-align: center; line-height: 1.15; }
.pk small { font-size: 10.5px; color: var(--muted); }
.pk.on { border-color: var(--cyan); background: #123270; }
.tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.tools .count { font-weight: 800; }
.tools .r { display: flex; gap: 8px; flex-wrap: wrap; }
select { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 7px 10px; }
.filters { display: grid; gap: 12px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 12px; }
.fg { display: grid; gap: 6px; }
.fg h4 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button { border: 1px solid var(--line2); background: #071229; color: var(--muted); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.pills button.on { color: #fff; border-color: transparent; background: linear-gradient(90deg, var(--blue2), var(--blue)); }
.price { display: flex; gap: 6px; align-items: center; }
.price input { width: 110px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line2); background: #050c1d; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(180deg, #0d1d3e, #091530); min-width: 0; }
.card .phw { position: relative; display: block; }
.card .ph { border-radius: 0; }
.ov { position: absolute; left: 7px; right: 7px; display: flex; gap: 5px; flex-wrap: wrap; }
.ov.t { top: 7px; } .ov.b { bottom: 7px; }
.b { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: rgba(4, 9, 22, .85); color: var(--text); border: 1px solid rgba(124, 200, 255, .3); }
.b.new { background: var(--gold); color: #2a1d00; border-color: transparent; }
.b.psa { background: var(--psa); color: #fff; border-color: transparent; }
.b.gr { background: var(--grade); color: #fff; border-color: transparent; }
.b.auc { background: var(--warn); color: #2a1d00; border-color: transparent; }
.b.ed { background: #0b2b4d; color: var(--gold); border-color: rgba(255, 209, 102, .5); }
.ptag { font: 800 18px var(--display); padding: 3px 10px; border-radius: 10px; color: #fff; background: rgba(26, 95, 214, .95); }
.card .bd { display: grid; gap: 5px; padding: 9px 11px 11px; flex: 1; align-content: start; }
.card .tt { font-weight: 700; font-size: 13.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text); }
.card .wh { font-size: 12px; color: var(--muted); }
.card .wh b { color: var(--sky); }
.go { margin-top: auto; display: block; text-align: center; padding: 10px; border-radius: 12px; font-weight: 800; color: #fff; background: linear-gradient(90deg, var(--blue2), var(--blue), var(--cyan)); }
.empty { padding: 30px 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 12px; background: #102a5c; border: 1px solid var(--sky); font-weight: 700; }
/* connect this phone (the phone key, once) */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(2, 6, 16, .78); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.sheet { width: min(100%, 520px); display: grid; gap: 12px; padding: 18px; border-radius: 18px; border: 1px solid var(--line2); background: linear-gradient(180deg, #10265a, #0b1832); }
.sheet h2 { font-size: 21px; }
.sheet p, .sheet ol { margin: 0; color: var(--muted); }
.sheet ol { padding-left: 20px; display: grid; gap: 6px; }
.sheet b { color: var(--text); }
.sheet input { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line2); background: #050c1d; font-size: 16px; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .go { margin-top: 0; border: 0; cursor: pointer; font: inherit; font-weight: 800; flex: 1; }
.sheet .msg { min-height: 1.2em; font-weight: 700; color: var(--warn); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
@media (max-width: 720px) {
  .brand span { display: none; }
  .qform { order: 3; flex-basis: 100%; }
  .pill { margin-left: auto; }
  .coll { grid-template-columns: 110px 1fr; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .folders { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .running .bar { display: none; }
  .ptag { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { .running .spin { animation: none; } .track i { transition: none; } }
</style>

<script>/* PokéFinder's search engine inside the phone page (owner, 28 October 2026: "with only PokéFinder open on the phone, in Safari, the

   Same reading of a search and same title rules as the computer's engine: motor.plan_spec / exact_card (Python) -> planSpec /
   exactCard, app_job.matcher / goldstar_rule -> matcher. The patterns themselves come from Python (nube.engine_data, D.engine), so
   both stay the same; nube.py build puts this file inside the page. eBay is searched through the site's own API (/api/ebay: the eBay
   keys stay on Cloudflare); the card's identity, picture and Cardmarket prices come from pokemontcg.io and TCGdex (open to any page).
   What only the computer does (Mercari, SNKRDUNK... the photo checks, the grade on the label) is added when the app is open there.

  const act = JOBS().filter(ACTIVE).concat(S.requests.filter((r) => ["new", "asked"].includes(r.status) && !r.phone && Date.now() - (r.at || 0) < 24 * 3600e3 && !JOBS().some((j) => j.id === r.id)).map((r) => ({ id: r.id, label: (r.query || r.group) + (r.status === "asked" ? " (esperando tu OK)" : ""), progress: 0, search: r.search || slug(r.query || r.group || ""), status: "new" })));
  const box = $("#running"); box.hidden = !act.length;
  if (!act.length) return;
  const j = act[0];
  $("#runTxt").textContent = (act.length > 1 ? `${act.length} búsquedas en curso · ` : j.status === "new" ? "Pedida: " : "Buscando: ") + j.label + (j.status === "new" ? "" : ` · ${j.progress || 0}%`);
  $("#runBar").style.width = (j.progress || 2) + "%";

}
async function gh(path, opts = {}) {   // GitHub's API with the owner's phone key (a token that can only read and write issues in this repository)
  const r = await fetch(GH + path, { ...opts, cache: "no-store", headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + KEY, ...(opts.body ? { "content-type": "application/json" } : {}) } });
  if (!r.ok) throw Object.assign(new Error("GitHub " + r.status), { status: r.status });
  return r.status === 204 ? null : r.json();
}
function requestOf(i) {   // a GitHub issue "Buscar: <text>" / "Grupo: <id>" -> a request, as nube.request_of
  const m = /^\s*(buscar|grupo):\s*(.+)/i.exec(i.title || "");
  if (!m || i.pull_request || (i.user && i.user.login.toLowerCase()) !== OWNER) return null;
  const lab = new Set((i.labels || []).map((l) => l.name));
  const status = i.state === "closed" ? (lab.has("rechazada") ? "rejected" : lab.has("reemplazada") ? "replaced" : "done")
    : lab.has("tomada") ? "taken" : lab.has("esperando-ok") ? "asked" : "new";
  const q = m[2].trim().slice(0, 120);
  return { id: "i" + i.number, number: i.number, at: Date.parse(i.created_at), status, ...(m[1].toLowerCase() === "grupo" ? { group: q } : { query: q, search: slug(q) }),
    phone: lab.has("movil-hecha") ? "done" : lab.has("movil-error") ? "error" : undefined };
}

/* the phone key, once per phone (owner, 31 October 2026: "searching on the phone must not send me to GitHub") */
const TOKEN_URL = "https://github.com/settings/personal-access-tokens/new?" + new URLSearchParams({ name: "PokéFinder móvil",
  description: "Pedir búsquedas desde la página de PokéFinder", target_name: REPO.split("/")[0], expires_in: "none", issues: "write" });
const KEY_GONE = "La clave guardada en este móvil ya no vale (caducada o borrada): crea otra y pégala aquí.";
function connectPhone(body, why) {
  document.querySelectorAll(".veil").forEach((x) => x.remove());
  const inp = el("input", { type: "password", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "github_pat_…", "aria-label": "Clave del móvil" });
  const msg = el("div", { class: "msg", role: "status", text: why || "" });
  const close = () => { veil.remove(); document.removeEventListener("keydown", esc); };
  const esc = (e) => { if (e.key === "Escape") close(); };
  const save = async () => {
    const k = inp.value.trim();
    if (!IS_KEY(k)) { msg.textContent = "Eso no parece una clave de GitHub: empieza por github_pat_. Cópiala entera."; return; }
    msg.textContent = "Comprobando la clave…";
    try {   // it must see this repository's issues; whether it may open them is seen on the first search
      const r = await fetch(GH + "/issues?per_page=1", { cache: "no-store", headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + k } });
      if (r.status === 401) { msg.textContent = "GitHub no reconoce esta clave. Cópiala otra vez, entera."; return; }
      if (!r.ok) { msg.textContent = "Esta clave no ve tu repositorio pokefinder: al crearla, elige «Only select repositories» → pokefinder."; return; }
    } catch { msg.textContent = "Sin conexión. Inténtalo otra vez."; return; }
    KEY = k; S.keyBad = false;
    try { localStorage.setItem("pf_key", k); } catch {}
    close(); toast("✔ Móvil conectado: ya buscas desde aquí.");
    if (body) ask(body); else { render(); poll(); }
  };
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") save(); });
  const veil = el("div", { class: "veil", onclick: (e) => { if (e.target === veil) close(); } },
    el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "ckt" },
      el("h2", { id: "ckt", text: "Conecta este móvil para buscar" }),
      el("p", { text: "Solo la primera vez. Las búsquedas las hace GitHub, con el ordenador apagado, y necesita tu clave del móvil: una clave de tu cuenta de GitHub que solo sirve para pedir búsquedas en tu repositorio pokefinder. Se queda guardada en este móvil." }),
      el("ol", {}, el("li", {}, "Pulsa ", el("b", { text: "Crear la clave en GitHub" }), ": se abre con todo rellenado (entra con tu cuenta si te lo pide)."),
        el("li", {}, "En ", el("b", { text: "Repository access" }), " elige ", el("b", { text: "Only select repositories" }), " → ", el("b", { text: "pokefinder" }), "."),
        el("li", {}, "Pulsa ", el("b", { text: "Generate token" }), " y copia la clave (empieza por github_pat_)."),
        el("li", {}, "Vuelve aquí, pégala abajo y pulsa ", el("b", { text: body ? "Guardar y buscar" : "Guardar" }), ".")),
      el("a", { class: "btn", href: TOKEN_URL, target: "_blank", rel: "noopener noreferrer", style: "text-align:center", text: "Crear la clave en GitHub ↗" }),
      inp, msg,
      el("div", { class: "row" }, el("button", { class: "go", type: "button", onclick: save, text: body ? `Guardar y buscar «${body.query || body.group}»` : "Guardar" }),
        el("button", { class: "btn", type: "button", onclick: close, text: "Cancelar" }))));
  document.addEventListener("keydown", esc);
  document.body.append(veil);
  inp.focus();
}
async function ask(body) {
  if (!REPO) return toast("Esta página no tiene buscador conectado.");
  if (!KEY || S.keyBad) return connectPhone(body, S.keyBad ? KEY_GONE : "");
  try {
    const title = body.group ? "Grupo: " + body.group : "Buscar: " + body.query;
    // the same search asked again replaces the one still waiting (the Worker did the same)
    for (const r of S.requests.filter((r) => ["new", "asked"].includes(r.status) && (body.group ? r.group === body.group : (r.query || "").toLowerCase() === (body.query || "").toLowerCase())))
      await gh(`/issues/${r.number}/labels`, { method: "POST", body: JSON.stringify({ labels: ["reemplazada"] }) }).then(() =>
        gh(`/issues/${r.number}`, { method: "PATCH", body: JSON.stringify({ state: "closed", state_reason: "not_planned" }) })).catch(() => {});
    const i = await gh("/issues", { method: "POST", body: JSON.stringify({ title, body: "Pedida desde la página de PokéFinder." }) });
    const j = requestOf(i) || { id: "i" + i.number, number: i.number, at: Date.now(), status: "new", ...body };
    S.requests = [j, ...S.requests.filter((x) => x.id !== j.id)];
    const target = body.group || D.searches.find((s) => s.id === slug(body.query))?.id || slug(body.query);
    if (body.query) phoneSearch(j, body.query);
    else toast(claudeOn() ? "🚀 Enviada: el buscador empieza enseguida." : "Enviada: empieza en cuanto la app PokéFinder esté abierta en el ordenador.");
    go("search", target);
  } catch (e) {
    if (e.status === 401) { S.keyBad = true; return connectPhone(body, KEY_GONE); }
    if (e.status === 403 || e.status === 404) return connectPhone(body, "Esta clave no puede pedir búsquedas: créala otra vez con «Issues: Read and write» y el repositorio pokefinder.");
    toast("Sin conexión: no se pudo enviar la búsqueda. Inténtalo otra vez.");
  }
}
function phoneSearch(r, query) {   // GitHub searches it in every market (buscar.yml); followPhone reads how it goes
  const id = slug(query);
  S.local = [{ id: r.id, number: r.number, phone: true, search: id, label: query, status: "running", progress: 2, message: "Pedida. GitHub empieza en unos segundos…",
    at: Date.now(), since: Date.now(), seen: 0, changed: Date.now(), sha: null }, ...S.local.filter((x) => x.search !== id)];
}
function resumePhone() {   // searches GitHub is still doing (asked before this page was opened, or on another device): followed too
  for (const r of S.requests) {
    if (!r.query || r.status !== "new" || r.phone || Date.now() - r.at > 45 * 60e3 || S.local.some((j) => j.id === r.id)) continue;
    S.local.push({ id: r.id, number: r.number, phone: true, search: r.search, label: r.query, status: "running", progress: 2, message: "GitHub la está buscando…",
      at: Date.now(), since: r.at, seen: 0, changed: Date.now(), sha: null });
  }
}
const RAW = (sha, id) => `https://raw.githubusercontent.com/${REPO}/${sha}/api/results/${encodeURIComponent(id)}.json`;
function phoneState(comments) {   // the newest state GitHub wrote on the search's issue (buscar.py say)
  for (const c of [...(comments || [])].reverse()) {
    if (!c.user || c.user.login !== "github-actions[bot]") continue;   // only GitHub's own: anyone can comment on a public repository
    const b = c.body || "", k = b.indexOf(MARK), e = b.indexOf(" -->", k);
    if (k < 0 || e < 0) continue;
    try { return JSON.parse(b.slice(k + MARK.length, e)); } catch {}
  }
  return null;
}
async function followPhone() {   // each search GitHub is doing for this phone: its bar, its results as they come, done or failed
  if (followPhone.busy) return false;
  followPhone.busy = true;
  let moved = false;
  try {
    for (const j of S.local.filter(ACTIVE)) {
      const before = JSON.stringify([j.progress, j.message, j.status, j.sha]);
      const r = S.requests.find((x) => x.id === j.id);
      let d = null;
      if (KEY && !S.keyBad && j.number) d = await gh(`/issues/${j.number}/comments?per_page=100`).then(phoneState).catch((e) => { if (e.status === 401) S.keyBad = true; return null; });
      j.at = Date.now();
      if (d) {
        if (JSON.stringify(d) !== j.last) { j.last = JSON.stringify(d); j.changed = Date.now(); }
        j.seen = Date.now(); j.progress = Math.max(j.progress || 0, d.progress || 0); if (d.message) j.message = d.message;
        if (d.sha && d.sha !== j.sha && await merge(j.search, RAW(d.sha, j.search))) j.sha = d.sha;   // the results so far
      }
      if (d && d.status === "done" && j.sha === d.sha) {   // done once its final results are in the page
        j.status = "done"; j.progress = 100;
        const n = (D.listings[j.search] || []).filter((l) => !l.pd && !l.pw).length;
        toast(n ? `✔ Lista: ${n} anuncio${n > 1 ? "s" : ""}.` : "Lista: no hay anuncios de esta carta a la venta ahora mismo.");
      } else if (d && d.status === "error") {
        j.status = "error"; j.message = d.message || "GitHub no pudo terminar la búsqueda. Inténtalo otra vez.";
      } else if (r && r.phone === "error") {
        j.status = "error"; j.message = "GitHub no pudo hacer la búsqueda. Inténtalo otra vez.";
      } else if (!d && r && r.phone === "done") {   // searched without a progress comment (GitHub's search before 31 October 2026)
        if (await merge(j.search)) { j.status = "done"; j.progress = 100; j.message = "Lista."; }
      } else if (Date.now() - j.changed > 20 * 60e3) {
        j.status = "error"; j.message = "GitHub lleva 20 minutos sin dar señales. Inténtalo otra vez.";
      } else if (!d && Date.now() - j.since > 3 * 60e3) {
        j.message = "GitHub tiene cola y tarda en empezar; la búsqueda sigue pedida.";
      }
      moved = moved || before !== JSON.stringify([j.progress, j.message, j.status, j.sha]);

}
function redraw() {   // never redraw a filter box while it is being typed in
  const typing = document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName) && document.activeElement.closest("#view");
  if (typing) renderRunning(); else render();
}
async function poll() {   // live progress every 15 s while the page is visible
  const before = JSON.stringify([S.db, S.jobs, S.requests, S.keyBad]);
  try {
    const r = await fetch("api/state.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error(r.status);
    const st = await r.json(); S.db = true; S.jobs = st.jobs || []; S.claude = st.claude || null;
    if (KEY && REPO) {   // the requests: GitHub issues
      const iss = await gh("/issues?state=all&per_page=30&sort=created&direction=desc").catch((e) => { if (e.status === 401) S.keyBad = true; return null; });
      if (iss) { S.keyBad = false; S.requests = iss.map(requestOf).filter(Boolean); resumePhone(); }
    }
    // newer than this page, or a search the page does not carry (searched on a phone: it exists only online)
    for (const x of st.results || []) if ((x.at > Number(D.v || 0) || !D.searches.some((s) => s.id === x.id)) && x.at > (S.got[x.id] || 0)) await merge(x.id);
  } catch { S.db = null; }
  const moved = await followPhone();
  try {   // the page was republished: reload, staying on the same view
    const v = await (await fetch("version.json?t=" + Date.now(), { cache: "no-store" })).json();
    if (v.v && D.v && v.v !== D.v && !S.local.some(ACTIVE)) { location.reload(); return; }   // never in the middle of a search on the phone
  } catch {}
  renderPill();
  if (JSON.stringify([S.db, S.jobs, S.requests, S.keyBad]) === before && !S.changed && !moved) return;   // nothing new: leave the view alone
  S.changed = false;
  redraw();
}
async function merge(id, url) {   // a search's newest results replace what the page carries (the published copy, or a phone search's own commit)
  try {
    const r = await fetch(url || "api/results/" + encodeURIComponent(id) + ".json?t=" + Date.now(), { cache: "no-store" });
    const d = r.ok ? await r.json() : null;
    if (!d || !d.search) return false;
    if (d.at < (S.got[id] || 0)) return true;   // the page already has newer ones
    S.got[id] = d.at;
    const s = { ...d.search, thumbs: d.listings.filter((l) => l.x).slice(0, 4).map((l) => l.x) };
    D.searches = [s, ...D.searches.filter((x) => x.id !== id)];
    D.listings[id] = d.listings;
    if (S.search && S.search.id === id) S.search = s;
    if (S.pending === id) { S.search = s; S.pending = null; }
    S.changed = true;
    return true;
  } catch { return false; }
}
function connect() { poll(); setInterval(() => { if (!document.hidden) poll(); }, 15000);
  setInterval(async () => { if (!document.hidden && S.local.some(ACTIVE) && await followPhone()) { S.changed = false; redraw(); } }, 4000);   // a phone search: every 4 s
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); }); }

/* ---------- events and start */
$("#qform").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#q").value.trim(); if (q.length < 2) return toast("Escribe al menos 2 letras");
  $("#q").value = ""; $("#q").blur(); const have = D.searches.find((s) => s.id === slug(q)); if (have) { go("search", have.id); toast("Ya la tienes guardada. Pulsa «Refrescar» para buscar de nuevo."); } else ask({ query: q }); });
$("#home").addEventListener("click", (e) => { e.preventDefault(); go("home"); });
document.querySelectorAll(".nav button").forEach((b) => b.addEventListener("click", () => go(b.dataset.v)));
setInterval(renderPill, 60000);
window.addEventListener("hashchange", () => { const h = decodeURIComponent(location.hash.slice(1));
  if (h === "recent") go("recent"); else if (h.length > 1 && (!S.search || S.search.id !== h)) go("search", h); else if (!h) go("home"); });
const start = decodeURIComponent((location.hash || "").slice(1));
if (start === "recent") go("recent"); else if (start && start.length > 1) go("search", start); else go("home");
